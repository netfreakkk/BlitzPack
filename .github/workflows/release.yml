name: Release Standalone Binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows Executable
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies & PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install .[all] pyinstaller pywin32

      - name: Compile Standalone Executables
        run: |
          pyinstaller BlitzPack.spec --noconfirm
          pyinstaller blitzpack-gui.spec --noconfirm
          pyinstaller installer.spec --noconfirm

      - name: Publish Executables to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/blitzpack.exe
            dist/blitzpack-gui.exe
            dist/BlitzPack-Setup.exe
          draft: false
          prerelease: false
